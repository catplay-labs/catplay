[package]
name = "catplay_lingo"
version = "0.1.0"
edition = "2024"

[features]
generator = ["dep:anyhow", "dep:plist", "dep:heck"]

[dependencies]
catplay_path = { path = "../catplay_path" }
catplay_reflect = { path = "../catplay_reflect" }
anyhow = { version = "1", optional = true }
heck = { version = "0.5", optional = true }
bitflags = { version = "2.10.0", default-features = false }
plist = { version = "=1.10.1", optional = true }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
insta = "1.44.3"

[[bin]]
name = "catplay_lingo"
path = "src/main.rs"
required-features = ["generator"]

[[bin]]
name = "iapd-log"
path = "src/bin/iapd_log.rs"
