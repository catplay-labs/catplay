[package]
name = "catplay_hap"
version = "0.1.0"
edition = "2024"

[dependencies]
catplay_mfi = { path = "../catplay_mfi" }
catplay_tracing = { path = "../catplay_tracing" }
catplay_tracing_macro = { path = "../catplay_tracing_macro", default-features = false }
catplay_util = { path = "../catplay_util", optional = true }

# Db serializer
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "rc",
], optional = true }
postcard = { version = "1.1.3", features = ["use-std"], optional = true }

# Main crypto
ring = { version = "0.17.14", default-features = false }

# AES-CTR (unsupported by Ring)
aes = "0.8.4"
ctr = "0.9.2"
poly1305 = "0.8.0"

# SRP
srp = "0.7.0-rc.1"
digest = "0.11.0-rc.9"
#num-bigint = "0.4.6"

# Others
log = "0.4.27"
thiserror = "2.0.12"
uuid = { version = "1.16.0", default-features = false, features = [
    "serde",
    "v4",
    "rng-rand",
] }
openssl = { version = "0.10.75", optional = true }
libc = "0.2.186"

[features]
std = [
    "dep:postcard",
    "dep:serde",
    "catplay_tracing/std",
    "catplay_tracing_macro/std",
    "dep:catplay_util",
]
# If OpenSSL then OpenSSL for PairSetup, else Ring
openssl = ["dep:openssl", "std"]
# If fast_chacha then fast_chacha for HomeKitCipher, else Ring
fast_chacha = []
# Prefer AF_ALG AES-CTR backend when available.
mips_prefers_af_alg = []
carplay_pair_setup_cache = []
default = ["std", "openssl", "mips_prefers_af_alg", "carplay_pair_setup_cache", "fast_chacha"]

[dev-dependencies]
criterion = { version = "0.8.1", default-features = false, features = [
    "cargo_bench_support",
] }
chacha20 = "0.9.1"
rand = "0.9.1"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "profile_pair_setup"
path = "src/bin/profile_pair_setup.rs"
required-features = ["std"]

[[bench]]
name = "pair_setup"
harness = false

[[bench]]
name = "cipher"
harness = false

[[bench]]
name = "aes_ctr"
harness = false
required-features = ["openssl"]

[[bench]]
name = "aes_ctr_prefetch"
harness = false
required-features = ["std"]

[[bench]]
name = "chacha_prefetch"
harness = false
required-features = ["std"]

[[bench]]
name = "fast_chacha20_compare"
harness = false

[[test]]
name = "fast_chacha20_is_using_asm"
path = "tests/fast_chacha20/is_using_asm.rs"

[[test]]
name = "fast_chacha20_rfc7539"
path = "tests/fast_chacha20/rfc7539.rs"

[[test]]
name = "fast_poly1305_poly1305"
path = "tests/fast_poly1305/poly1305.rs"

[[test]]
name = "cipher_test"
path = "tests/cipher/cipher_test.rs"

[profile.release]
debug = true
