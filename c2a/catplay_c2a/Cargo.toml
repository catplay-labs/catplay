#cargo-features = [ "profile-rustflags" ]

[package]
name = "catplay_c2a"
version = "0.1.0"
edition = "2024"

[features]
default = ["jemalloc", "ui"]
ui = []
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys"]
mimalloc = ["dep:mimalloc"]

[dependencies]

libc = "=1.0.0-alpha.4"
log = { version = "0.4.27", default-features = false, features = [
    "release_max_level_info",
] }
macaddr = "1.0.1"

#####
catplay_mfi = { path = "../../core/catplay_mfi" }
catplay_util = { path = "../../core/catplay_util" }
catplay_bt = { path = "../../bluetooth/catplay_bt" }
catplay_hap = { path = "../../core/catplay_hap" }
catplay_carplay = { path = "../../carplay/catplay_carplay" }
catplay_iap2_usb = { path = "../../usb/catplay_iap2_usb" }
# catplay_iap2_usb_gadget = { path = "../../usb/catplay_iap2_usb_gadget" }
catplay_iap2_usb_host = { path = "../../usb/catplay_iap2_usb_host" }
catplay_iap2_client = { path = "../../async/catplay_iap2_client" }
catplay_csm = { path = "../../core/catplay_csm" }
catplay_hid = { path = "../../carplay/catplay_hid" }
catplay_carplay_tx_gadget = { path = "../../catplay_carplay_tx_gadget" }
catplay_carplay_rx_gadget = { path = "../../catplay_carplay_rx_gadget" }

catplay_tracing = { path = "../../core/catplay_tracing" }
catplay_tracing_macro = { path = "../../core/catplay_tracing_macro" }

catplay_fb = { path = "../catplay_fb" }

#####

serde = { version = "1.0.219", default-features = false, features = ["derive"] }
toml = { version = "0.9.11", default-features = false, features = [
    "parse",
    "serde",
] }
uuid = { version = "1.17.0", default-features = false, features = ["v5"] }
tokio = { version = "1.48.0", features = ["rt", "signal"] }
futures = "0.3.31"
if-addrs = "0.14.0"
async-trait = "0.1.89"
thiserror = "2.0.16"
#rtkit-rs = "0.1.0"

bytes = "1.11.0"
mimalloc = { version = "0.1.46", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true, default-features = false }
tikv-jemalloc-sys = { version = "0.7.0", optional = true, features = [
    "override_allocator_on_supported_platforms",
] }
